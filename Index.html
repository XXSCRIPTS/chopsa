<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chipa Sahib AI</title>
    <style>
        :root {
            --bg-color: #121212;
            --chat-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #2ecc71; /* Chhipa Green theme color */
            --user-msg: #2c3e50;
            --bot-msg: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--chat-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
        }

        h1 {
            margin: 0;
            font-size: 1.3rem;
            color: #ffffff;
        }

        .api-container {
            display: flex;
            gap: 10px;
        }

        input[type="password"] {
            background: #333;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 75%;
        }

        .user-wrapper {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .bot-wrapper {
            align-self: flex-start;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--user-msg);
            border-top-right-radius: 2px;
        }

        .bot-message {
            background-color: var(--bot-msg);
            border-top-left-radius: 2px;
        }

        .system-message {
            background-color: transparent;
            color: #888;
            align-self: center;
            font-size: 0.9rem;
            text-align: center;
            max-width: 100%;
        }

        #input-container {
            background-color: var(--chat-bg);
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
        }

        #user-input {
            flex: 1;
            background-color: #333;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #27ae60;
        }

        button:disabled {
            background-color: #444;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <div class="profile-section">
