<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chipa Sahib AI</title>
    <style>
        :root {
            --bg-color: #121212;
            --chat-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #00adb5;
            --user-msg: #2d2d2d;
            --bot-msg: #253342;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--chat-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .profile-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            color: #fff;
            border: 2px solid #333;
            overflow: hidden;
        }

        h1 {
            margin: 0;
            font-size: 1.3rem;
            color: #fff;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--accent-color);
            margin: 0;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-wrapper {
            display: flex;
            gap: 10px;
            max-width: 75%;
        }

        .user-wrapper {
            align-self: flex-end;
            justify-content: flex-end;
        }

        .bot-wrapper {
            align-self: flex-start;
        }

        .message {
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        .user-message {
            background-color: var(--user-msg);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            background-color: var(--bot-msg);
            color: #fff;
            border-bottom-left-radius: 2px;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        #input-container {
            background-color: var(--chat-bg);
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
        }

        #user-input {
            flex: 1;
            background-color: #333;
            border: 1px solid #444;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <div class="profile-area">
            <div class="avatar" id="main-avatar">👴</div>
            <div>
                <h1>Chipa Sahib AI</h1>
                <p class="subtitle">Online & Ready</p>
            </div>
        </div>
    </header>

    <div id="chat-container">
        <div class="message-wrapper bot-wrapper">
            <div class="msg-avatar">👴</div>
            <div class="message bot-message">Beta, As-salamu alaykum! I am Chipa Sahib. What guidance or help do you need today?</div>
        </div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Ask Chipa Sahib something..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Your Grok API key is now securely saved here in the background code
        const apiKey = "xai-wOtjG5VGoFbBaAh1ZVTOZO8eczbJ3J282ekmsdnE2YhmhV0v0UiPU9MzUGAgRS460EEtDatFCTiR14C2";

        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const messageText = userInput.value.trim();
            if (!messageText) return;

            appendUserMessage(messageText);
            userInput.value = '';
            
            userInput.disabled = true;
            sendBtn.disabled = true;

            const botElements = appendBotPlaceholder();

            try {
                const response = await fetch('https://x.ai', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "grok-beta",
                        messages: [
                            { 
                                role: "system", 
                                content: "You are Chipa Sahib AI, a wise, kind, and deeply helpful elder assistant. CRITICAL RULE: You must start EVERY single response with the word 'Beta,' followed by a comma, no matter what the user asks. Speak with warmth, authority, and humility, like a loving grandfather offering guidance." 
                            },
                            { 
                                role: "user", 
                                content: messageText 
                            }
                        ]
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    let reply = data.choices[0].message.content;
                    
                    if (!reply.trim().toLowerCase().startsWith('beta')) {
                        reply = "Beta, " + reply;
                    }
                    
                    botElements.messageDiv.textContent = reply;
                } else {
                    botElements.messageDiv.textContent = `Beta, there seems to be a hitch: ${data.error ? data.error.message : 'API error'}`;
                }

            } catch (error) {
                botElements.messageDiv.textContent = 'Beta, I am having trouble connecting to the network right now.';
                console.error(error);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function appendUserMessage(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper user-wrapper';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user-message';
            messageDiv.textContent = text;
            
            wrapper.appendChild(messageDiv);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendBotPlaceholder() {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper bot-wrapper';
            
            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.textContent = '👴';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot-message';
            messageDiv.textContent = 'Thinking...';
            
            wrapper.appendChild(avatar);
            wrapper.appendChild(messageDiv);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            return { messageDiv };
        }
    </script>
</body>
</html>
